<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- fondo -->
  <circle cx="50" cy="50" r="47" fill="#231F20" stroke="#CF2F2C" stroke-width="3"/>

  <!-- corteza (borde grueso curvo arriba) -->
