  <!-- pepperoni -->
  <circle cx="50" cy="38" r="4.2" fill="#CF2F2C" stroke="#a82320" stroke-width="0.6"/>
  <circle cx="40" cy="46" r="3.6" fill="#CF2F2C" stroke="#a82320" stroke-width="0.6"/>
  <circle cx="60" cy="46" r="3.6" fill="#CF2F2C" stroke="#a82320" stroke-width="0.6"/>
  <circle cx="50" cy="53" r="3.2" fill="#CF2F2C" stroke="#a82320" stroke-width="0.6"/>

  <!-- monograma -->
  <text x="50" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="22" letter-spacing="1" fill="#FFFFFF">BC</text>
</svg>
